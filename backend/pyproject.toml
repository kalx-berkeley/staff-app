[tool.black]
line-length = 92
target-version = ['py312']
include = '\.pyi?$'
preview = true
unstable = true



[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*Unclosed.*MemoryObjectSendStream.*:ResourceWarning",
    "ignore:.*Unclosed.*MemoryObjectReceiveStream.*:ResourceWarning",
    # Upstream-only warnings with no fix available on our side: starlette's own
    # testclient.py still references the deprecated anyio.abc.BlockingPortal alias,
    # and vaderSentiment's bundled lexicon loader still calls codecs.open(). Both
    # packages are already pinned to their latest release.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
    "ignore:codecs.open\\(\\) is deprecated.*:DeprecationWarning:vaderSentiment.vaderSentiment",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
