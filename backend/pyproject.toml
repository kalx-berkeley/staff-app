[tool.black]
line-length = 92
target-version = ['py312']
include = '\.pyi?$'
preview = true
unstable = true



[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*Unclosed.*MemoryObjectSendStream.*:ResourceWarning",
    "ignore:.*Unclosed.*MemoryObjectReceiveStream.*:ResourceWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
