# Apache VirtualHost configuration for auth.stage.${KALX_DOMAIN_SUFFIX}
#
# This site's sole job is to handle the Google OAuth2 callback (OIDCRedirectURI).
# It holds no application content of its own.  Session cookies are scoped to
# .stage.${KALX_DOMAIN_SUFFIX} so the session established here is automatically presented
# on staff.stage.${KALX_DOMAIN_SUFFIX}.
#
# Prerequisites (root):
#   apt install libapache2-mod-auth-openidc
#   a2enmod auth_openidc ssl rewrite
#
# Variables and secrets are loaded from two conf files:
#   apache/kalx-variables.conf.example → /etc/apache2/conf-available/kalx-variables.conf
#   apache/kalx-secrets.conf.example   → /etc/apache2/conf-available/kalx-secrets.conf
# See those files for deployment instructions and required permissions.
#
# Google OAuth setup: See README.md

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName auth.stage.${KALX_DOMAIN_SUFFIX}
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ─── HTTPS ───────────────────────────────────────────────────────────────────

<VirtualHost *:443>
    ServerName auth.stage.${KALX_DOMAIN_SUFFIX}

    # --- mod_auth_openidc ---
    OIDCProviderMetadataURL https://accounts.google.com/.well-known/openid-configuration
    OIDCClientID     ${KALX_CLIENT_ID}
    OIDCClientSecret ${KALX_CLIENT_SECRET}
    OIDCRedirectURI  https://auth.stage.${KALX_DOMAIN_SUFFIX}/redirect_uri
    OIDCCryptoPassphrase ${KALX_CRYPTO_PASSPHRASE}
    OIDCScope "openid email"
    OIDCSessionInactivityTimeout 86400
    # client-cookie stores the session in an encrypted browser cookie so the
    # staff VirtualHost can validate it with the shared passphrase without
    # needing access to the auth VirtualHost's server-side SHM cache.
    OIDCSessionType client-cookie
    OIDCCacheType shm
    # Scope the session cookie to the parent domain so staff.stage.${KALX_DOMAIN_SUFFIX}
    # can read it without requiring a second login.
    OIDCCookieDomain .stage.${KALX_DOMAIN_SUFFIX}
    OIDCCookiePath /

    # Protect only the OAuth callback path with mod_auth_openidc.
    # Scoping to /redirect_uri (not <Location />) avoids a class of bugs where
    # any direct visit to the auth site triggers a new OAuth flow anchored here
    # rather than on the staff site, producing a redirect loop or 404 when
    # mod_auth_openidc has no DocumentRoot to fall back on.
    <Location /redirect_uri>
        AuthType openid-connect
        # Defense in depth: block the OAuth callback from DJ studio IPs so a
        # session cookie can never be created from those machines.
        # Logout requests use the same /redirect_uri path (with ?logout=) so
        # the DJ IP block must not apply to them — otherwise logout returns 403.
        <If "%{QUERY_STRING} !~ /logout=/">
            <RequireAll>
                Require valid-user
                Require not ip ${KALX_DJ_STUDIO_NETWORK}
            </RequireAll>
        </If>
        <Else>
            Require all granted
        </Else>
    </Location>

    # Serve a simple landing page explaining what this endpoint is.
    # Deploy apache/www/html/auth.stage/ to this path on the server.
    DocumentRoot /var/www/html/auth.stage
    <Directory /var/www/html/auth.stage>
        Options -Indexes
        AllowOverride None
    </Directory>

    # ─── Diagnostics (remove when stable) ────────────────────────────────────

    # Stamp every response so you can confirm which VirtualHost answered:
    #   curl -sI https://auth.stage.${KALX_DOMAIN_SUFFIX}/ | grep X-KALX
    # Requires: a2enmod headers
    Header always set X-KALX-VirtualHost "auth.stage.${KALX_DOMAIN_SUFFIX}"

    # Elevate mod_auth_openidc log verbosity.  After any OAuth attempt run:
    #   grep auth_openidc /var/log/apache2/kalx-stage-auth-error.log
    LogLevel warn auth_openidc:debug

    # Auth-free probe — bypasses OAuth entirely (mod_alias runs before auth).
    # Usage:  curl -sI https://auth.stage.${KALX_DOMAIN_SUFFIX}/ping
    # Expect: 302 → https://staff.stage.${KALX_DOMAIN_SUFFIX}/?auth-vhost=active
    # If you instead see the default Apache page, this VirtualHost is not loaded.
    RedirectMatch 302 ^/ping$ https://staff.stage.${KALX_DOMAIN_SUFFIX}/?auth-vhost=active

    # --- SSL ---
    SSLEngine on
    # Certificate managed by Certbot:
    SSLCertificateFile    /etc/letsencrypt/live/auth.stage.${KALX_DOMAIN_SUFFIX}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/auth.stage.${KALX_DOMAIN_SUFFIX}/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- Logging ---
    ErrorLog  /var/log/apache2/kalx-stage-auth-error.log
    CustomLog /var/log/apache2/kalx-stage-auth-access.log combined
</VirtualHost>
