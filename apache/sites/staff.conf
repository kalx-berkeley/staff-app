# Apache VirtualHost configuration for staff.${KALX_DOMAIN_SUFFIX}
#
# This is the top-level KALX staff portal.  The staff-app React SPA is served
# at / and hosts every sub-site (e.g. the Radio Pass Giveaway at
# /pass-giveaway/), with its API at /api/.  Adding a new sub-site needs no
# changes here unless it relaxes authentication for some of its paths.
#
# Authentication is enforced globally via mod_auth_openidc.  Specific paths
# relax it in the location blocks below (e.g. the Radio Pass Giveaway DJ path).
#
# Prerequisites (root):
#   apt install libapache2-mod-auth-openidc
#   a2enmod auth_openidc proxy proxy_http headers remoteip ssl rewrite alias deflate
#
# Variables and secrets are loaded from two conf files:
#   apache/kalx-variables.conf.example → /etc/apache2/conf-available/kalx-variables.conf
#   apache/kalx-secrets.conf.example   → /etc/apache2/conf-available/kalx-secrets.conf
# See those files for deployment instructions and required permissions.
#
# Google OAuth setup: See the kalx-staff README.md

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName staff.${KALX_DOMAIN_SUFFIX}
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ─── HTTPS ───────────────────────────────────────────────────────────────────

<VirtualHost *:443>
    ServerName staff.${KALX_DOMAIN_SUFFIX}

    # --- mod_auth_openidc ---
    # Must use the same OIDCClientID, OIDCClientSecret, OIDCRedirectURI, and
    # OIDCCryptoPassphrase as auth.conf so that session cookies are
    # mutually readable across both sites.
    OIDCProviderMetadataURL https://accounts.google.com/.well-known/openid-configuration
    OIDCClientID     ${KALX_CLIENT_ID}
    OIDCClientSecret ${KALX_CLIENT_SECRET}
    OIDCRedirectURI  https://auth.${KALX_DOMAIN_SUFFIX}/redirect_uri
    OIDCCryptoPassphrase ${KALX_CRYPTO_PASSPHRASE}
    OIDCScope "openid email"
    OIDCSessionInactivityTimeout 86400
    # Maximum session lifetime (7 days) from login, regardless of activity.
    # Must match the paired auth/staff conf so the shared cookie agrees.
    OIDCSessionMaxDuration 604800
    # ":persistent" keeps the session cookie across browser restarts; its
    # expiry is set by OIDCSessionInactivityTimeout.
    OIDCSessionType client-cookie:persistent
    OIDCCacheType shm
    OIDCCookieDomain .${KALX_DOMAIN_SUFFIX}
    OIDCCookiePath /
    # Distinct cookie name so a production session cookie can never collide
    # with a stage one — see auth.stage.conf for why. Must match auth.conf.
    OIDCCookie kalx_prod_session
    # Force Google's account chooser on every login. Without this, logging
    # out locally doesn't touch Google's own session, so a user who signed
    # in with the wrong account gets silently re-authenticated as that same
    # account on the next login.
    OIDCAuthRequestParams "prompt=select_account"

    # --- Security headers ---
    # Strip any X-Forwarded-User a client might send, then set it from OIDC.
    # The "early" keyword runs before other processing so mod_proxy cannot
    # re-inject a spoofed value.
    RequestHeader unset X-Forwarded-User early
    RequestHeader set X-Forwarded-User "%{OIDC_CLAIM_email}e" env=OIDC_CLAIM_email

    # Strip any incoming X-Forwarded-For; mod_proxy will add the real client IP.
    RequestHeader unset X-Forwarded-For early

    # Strip any client-supplied X-DJ-Network early to prevent spoofing.
    # The header is set to "1" inside the <If> block below when the request IP
    # is in the DJ studio network.
    RequestHeader unset X-DJ-Network early
    # Strip any client-supplied X-Station-Office-Network early to prevent spoofing.
    # The header is set to "1" inside the <If> block below when the request IP
    # is in the station office network.
    RequestHeader unset X-Station-Office-Network early

    # --- Compression ---
    # Debian's stock deflate.conf only covers HTML, CSS, JS, XML and plain
    # text, so it misses the API's JSON responses, the web manifests and
    # the SVG and ICO icons. Already-compressed formats (PNG, JPEG, WOFF2)
    # are left out on purpose. mod_deflate adds "Vary: Accept-Encoding"
    # itself. Requires: a2enmod deflate.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/csv text/markdown
        AddOutputFilterByType DEFLATE text/javascript application/javascript application/x-javascript
        AddOutputFilterByType DEFLATE application/json application/ld+json application/problem+json
        AddOutputFilterByType DEFLATE application/manifest+json application/xml application/rss+xml application/atom+xml
        AddOutputFilterByType DEFLATE image/svg+xml image/x-icon image/vnd.microsoft.icon
        AddOutputFilterByType DEFLATE font/ttf font/otf application/vnd.ms-fontobject
    </IfModule>

    # --- Staff App (SPA) ---
    # The whole site is one React single-page app, built from this repo's
    # frontend/ and deployed to the DocumentRoot below by the staff-app deploy.
    # It serves the home page at / and each sub-site under its own path
    # (e.g. /pass-giveaway/).
    # /api/ and /go/ (short links) are proxied to the FastAPI backend on localhost:8420 (production).
    #
    # These blocks live here (not in the deployed app directory) so the file is
    # root-owned and the staff-app OS user cannot modify Apache configuration.
    DocumentRoot /home/staff-app/staff-app-production/frontend/dist
    <Directory /home/staff-app/staff-app-production/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        # React client-side routing: rewrite unknown paths to index.html.
        # FallbackResource is avoided because it generates a subrequest for
        # /index.html that re-enters mod_auth_openidc, which can itself
        # generate another subrequest, repeating until Apache hits its
        # 10-level nesting limit.  The RewriteCond guards break that loop.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/index\.html$
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
        # The SPA entry point sits behind auth. Without no-store, a browser can
        # serve it from cache after logout instead of asking Apache, hiding that
        # the session is gone. Scoped to index.html only — hashed assets under
        # /assets/ keep their normal long-lived caching. Requires: a2enmod headers.
        <FilesMatch "^index\.html$">
            Header set Cache-Control "no-store"
        </FilesMatch>
    </Directory>

    # --- DJ studio network: mark requests + redirect before auth processing ---
    # X-DJ-Network tells the backend the request came from the DJ studio.
    # IS_DJ_NETWORK only feeds the "Require env IS_DJ_NETWORK" lines below,
    # which never match (see "How guests get in" below).
    <If "-R '${KALX_DJ_STUDIO_NETWORK}'">
        SetEnv IS_DJ_NETWORK 1
        RequestHeader set X-DJ-Network "1"
    </If>
    # Redirect everything except the DJ interface and what it loads (the SPA
    # entry point, static files, and the API) and short links (/go/, which
    # the backend checks itself) to the DJ interface before
    # mod_auth_openidc runs, preventing Google login on shared studio computers
    # and stopping session inheritance from a previous DJ's cookie.
    RewriteEngine On
    RewriteCond expr "-R '${KALX_DJ_STUDIO_NETWORK}'"
    RewriteCond %{REQUEST_URI} !^/pass-giveaway/dj
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/go/
    RewriteCond %{REQUEST_URI} !^/(assets|images)/
    RewriteCond %{REQUEST_URI} !^/site(-stage)?\.webmanifest$
    RewriteCond %{REQUEST_URI} !^/index\.html$
    RewriteRule ^ /pass-giveaway/dj [R=302,L]

    # --- Station office network: mark requests + internally rewrite SPA paths ---
    # X-Station-Office-Network tells the backend the request came from the
    # station office, which lets guests there use winner search.
    # IS_STATION_OFFICE_NETWORK only feeds the "Require env
    # IS_STATION_OFFICE_NETWORK" lines below, which never match (see "How
    # guests get in" below).
    # Unlike the DJ network, station office users are NOT redirected to a fixed
    # page and are NOT blocked from creating OIDC sessions — they can still
    # authenticate via Google if they want full staff access.
    <If "-R '${KALX_STATION_OFFICE_NETWORK}'">
        SetEnv IS_STATION_OFFICE_NETWORK 1
        RequestHeader set X-Station-Office-Network "1"
    </If>
    # Internally rewrite any /pass-giveaway/ path to /index.html.  This ensures
    # the <LocationMatch> block that carries OIDCUnAuthAction pass handles auth
    # instead of the global <Location /> block which carries OIDCUnAuthAction
    # auth and would redirect to Google.
    # The browser URL is preserved; React Router renders the correct page.
    # Other sub-sites (and the home page at /) are not rewritten, so station
    # office users sign in with Google for those as usual.
    RewriteCond expr "-R '${KALX_STATION_OFFICE_NETWORK}'"
    RewriteCond expr "! -R '${KALX_DJ_STUDIO_NETWORK}'"
    RewriteRule ^/pass-giveaway/ /index.html [L]

    # --- How guests get in (read this before changing any block below) ---
    # Every block requires "valid-user", so mod_auth_openidc checks for a
    # session on every request. OIDCUnAuthAction says what happens without one:
    # - auth (the default): send the browser to the Google login.
    # - pass: let the request through as an empty user. "Require valid-user"
    #   accepts that, and no X-Forwarded-User reaches the backend, which then
    #   decides what the guest may do.
    # So the blocks that set "OIDCUnAuthAction pass" are what let people in
    # without a login, not the Require lines. The "Require env IS_DJ_NETWORK"
    # and "Require env IS_STATION_OFFICE_NETWORK" lines never match: SetEnv
    # runs after authorization, so those variables aren't set yet when Require
    # is checked. Each block's Require lines replace its parent's rather than
    # adding to them (AuthMerging Off, the default).
    #
    # --- Default: require a Google login for everything ---
    # DJ studio network users reach this block only for API and static paths
    # (other paths are intercepted by the RewriteRule above and redirected to
    # /pass-giveaway/dj), and those have their own blocks below. Station office
    # users reach it for paths outside /pass-giveaway/, where they sign in like
    # anyone else.
    <Location />
        AuthType openid-connect
        <RequireAny>
            Require valid-user
            Require env IS_DJ_NETWORK
            Require env IS_STATION_OFFICE_NETWORK
        </RequireAny>
    </Location>

    # DJ/station-office paths: allow unauthenticated access from recognized networks.
    # OIDCUnAuthAction pass lets every request through without an OIDC session.
    # The RewriteRule below then sends anyone without a session who isn't on
    # the DJ studio or station office network to /, which falls under the
    # global <Location /> block (no OIDCUnAuthAction pass), so Apache's default
    # OIDCUnAuthAction auth initiates the Google OIDC flow there.
    <LocationMatch "^/(pass-giveaway/dj|index\.html)">
        AuthType openid-connect
        OIDCUnAuthAction pass
        # With pass, valid-user accepts everyone; the env lines never match.
        <RequireAny>
            Require valid-user
            Require env IS_DJ_NETWORK
            Require env IS_STATION_OFFICE_NETWORK
        </RequireAny>
        RewriteEngine On
        # Unauthenticated non-network users: redirect to / to trigger OIDC login.
        # Uses REMOTE_USER rather than OIDC_CLAIM_email: the SPA-fallback rewrite in the
        # Directory block above reaches this LocationMatch via an internal redirect, which
        # re-runs mod_auth_openidc auth for the new URI. That re-run sets REMOTE_USER
        # correctly but does not always re-export OIDC_CLAIM_email, which caused already
        # -authenticated users to be bounced back to the site root on any hard-loaded or
        # refreshed deep link (e.g. /pass-giveaway/staff/shows/123).
        RewriteCond %{REMOTE_USER} ^$
        RewriteCond expr "! -R '${KALX_DJ_STUDIO_NETWORK}'"
        RewriteCond expr "! -R '${KALX_STATION_OFFICE_NETWORK}'"
        RewriteRule ^ / [R=302,L]
        # SPA fallback: rewrite React client-side routes to index.html.
        RewriteCond %{REQUEST_URI} !^/index\.html$
        RewriteRule ^ /index.html [L]
    </LocationMatch>

    # Static files for the React SPA: allow unauthenticated access so the DJ
    # interface and winner search page can load CSS, JS, and icons without a
    # Google login. OIDCUnAuthAction pass serves them to anyone, from any
    # network: they're the public build output, with no data in them.
    <LocationMatch "^/((assets|images)/|site(-stage)?\.webmanifest$)">
        AuthType openid-connect
        OIDCUnAuthAction pass
        <RequireAny>
            Require valid-user
            Require env IS_DJ_NETWORK
            Require env IS_STATION_OFFICE_NETWORK
        </RequireAny>
    </LocationMatch>

    # All API endpoints: allow unauthenticated DJ studio and station office network
    # requests through.  OIDCUnAuthAction pass prevents Apache from returning 401
    # for unauthenticated requests; without it the JS interceptor turns that 401
    # into a redirect causing an infinite loop for network users.
    # pass lets every request without a session through, from any network, so
    # the backend is the authoritative auth boundary: check_apache_auth_layer
    # rejects requests with neither a signed-in user nor a DJ studio or station
    # office IP, and every sensitive endpoint has its own require_authentication /
    # get_promotions_staff / check_dj_access / check_station_office_access
    # dependency.
    <LocationMatch "^/api/">
        AuthType openid-connect
        OIDCUnAuthAction pass
        <RequireAny>
            Require valid-user
            Require env IS_DJ_NETWORK
            Require env IS_STATION_OFFICE_NETWORK
        </RequireAny>
    </LocationMatch>

    # Short links (/go/<slug>): the backend redirects active staff and shows
    # everyone else a small error page. DJ studio network clients that aren't
    # signed in pass straight through (the backend tells them short links
    # don't work there), because auth.conf won't sign anyone in from the DJ
    # studio, so a Google login could never finish. Everyone else, including
    # the station office network, signs in with Google first, as for the rest
    # of the site. Only the <If> decides this; the env lines never match.
    <Location /go/>
        AuthType openid-connect
        <If "-R '${KALX_DJ_STUDIO_NETWORK}'">
            OIDCUnAuthAction pass
        </If>
        <RequireAny>
            Require valid-user
            Require env IS_DJ_NETWORK
            Require env IS_STATION_OFFICE_NETWORK
        </RequireAny>
    </Location>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8420/api/
    ProxyPassReverse /api/ http://127.0.0.1:8420/api/
    ProxyPass        /go/ http://127.0.0.1:8420/go/
    ProxyPassReverse /go/ http://127.0.0.1:8420/go/

    # ─── SSL ─────────────────────────────────────────────────────────────────
    SSLEngine on
    # Certificate managed by Certbot:
    SSLCertificateFile    /etc/letsencrypt/live/staff.${KALX_DOMAIN_SUFFIX}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staff.${KALX_DOMAIN_SUFFIX}/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- Logging ---
    ErrorLog  /var/log/apache2/kalx-staff-error.log
    CustomLog /var/log/apache2/kalx-staff-access.log combined
</VirtualHost>
