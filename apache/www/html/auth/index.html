<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALX — Authentication Endpoint</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; max-width: 520px; margin: 6rem auto; padding: 0 1.5rem; color: #222; line-height: 1.6; }
h1  { font-size: 1.25rem; margin-bottom: 0.5rem; }
p   { margin: 0.75rem 0; color: #555; }
a   { color: #1a6fb0; }
</style>
</head>
<body>
<h1>KALX Staff Authentication Endpoint</h1>
<p>This site handles Google OAuth2 callbacks for the KALX staff portal. It is
not intended to be visited directly.</p>
<p>If you are trying to reach the staff portal, go to
<a id="staff-link" href="https://staff.kalx.berkeley.edu/">staff.kalx.berkeley.edu</a>.</p>
<script>
// This page is served at auth.<suffix>; the staff portal is always at
// staff.<suffix> on the same suffix, so derive the link from the hostname
// instead of hardcoding a domain suffix that differs between environments.
var staffHost = location.hostname.replace(/^auth\./, "staff.");
var link = document.getElementById("staff-link");
link.href = "https://" + staffHost + "/";
link.textContent = staffHost;
</script>
</body>
</html>
