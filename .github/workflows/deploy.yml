name: Deploy

on:
  push:
    branches: [ main ]
    # Pushes that change only these files skip the tests and the staging
    # deploy. CHANGELOG.md is among them, so run backend/tests/common/test_changelog.py
    # locally when cutting a release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apache/**'
      - 'LICENSE'
  schedule:
    # Production deploys happen here, while no live DJs are using the system
    - cron: '0 4 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the newest release to production now, even during live DJ hours (run from main; leave unticked to only run tests)
        type: boolean
        default: false

jobs:
  check-release:
    name: Check for a release to deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.deploy_production
    permissions:
      contents: read
      deployments: read
    outputs:
      # The tag to deploy to production, or empty if there's nothing to deploy
      release_tag: ${{ steps.check.outputs.release_tag }}

    steps:
    - name: Compare the newest release with what production has had deployed
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::error::Run the production deploy from main, not $GITHUB_REF"
          exit 1
        fi

        TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"

        if [ "$GITHUB_EVENT_NAME" == "schedule" ]; then
          DEPLOYMENT_IDS="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&ref=$TAG&per_page=100" --jq '.[].id')"
          for DEPLOYMENT_ID in $DEPLOYMENT_IDS; do
            STATES="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses?per_page=100" --jq '.[].state')"
            if grep --quiet --line-regexp success <<< "$STATES"; then
              echo "::notice::$TAG is already deployed to production"
              exit 0
            fi
          done
        fi

        echo "::notice::Deploying $TAG to production"
        echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  test-backend:
    name: Run Backend Tests
    needs: check-release
    runs-on: ubuntu-latest
    # check-release is skipped on runs that don't involve production
    if: ${{ !cancelled() && (needs.check-release.result == 'skipped' || needs.check-release.outputs.release_tag != '') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Empty (the triggering commit) unless this run is deploying a release
        ref: ${{ needs.check-release.outputs.release_tag && format('refs/tags/{0}', needs.check-release.outputs.release_tag) }}

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.14'

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        sudo apt install libjpeg-dev
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend tests
      working-directory: ./backend
      run: |
        black --check .
        pytest -n 4 --cov=app --cov-report=xml

  test-frontend:
    name: Run Frontend Tests
    needs: check-release
    runs-on: ubuntu-latest
    # check-release is skipped on runs that don't involve production
    if: ${{ !cancelled() && (needs.check-release.result == 'skipped' || needs.check-release.outputs.release_tag != '') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Empty (the triggering commit) unless this run is deploying a release
        ref: ${{ needs.check-release.outputs.release_tag && format('refs/tags/{0}', needs.check-release.outputs.release_tag) }}

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '26'

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: ./frontend
      run: |
        npm run lint
        npx tsc --noEmit
        npm test

    # Built here, alongside the backend tests, so the deploy job doesn't have to
    # install and build again. vite build skips the tsc step in npm run build,
    # which the tests above already ran.
    - name: Build frontend
      working-directory: ./frontend
      env:
        RELEASE_TAG: ${{ needs.check-release.outputs.release_tag }}
      run: |
        if [ -n "$RELEASE_TAG" ]; then
          VITE_RELEASE_VERSION="$RELEASE_TAG" npx vite build
        else
          VITE_COMMIT_SHA="${{ github.sha }}" npx vite build --mode staging
        fi

    - name: Upload frontend build
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: frontend-dist
        path: frontend/dist/
        if-no-files-found: error
        retention-days: 1

  deploy:
    name: Deploy
    needs: [ check-release, test-backend, test-frontend ]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.test-backend.result == 'success' && needs.test-frontend.result == 'success' && (needs.check-release.outputs.release_tag != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ needs.check-release.outputs.release_tag != '' && 'production' || 'staging' }}
      # A production run's commit is main's, not the release's, so its automatic
      # record would be wrong. "Record the deployment" below writes the right one.
      deployment: ${{ needs.check-release.outputs.release_tag == '' }}

    env:
      RELEASE_TAG: ${{ needs.check-release.outputs.release_tag }}
      ENV_NAME: ${{ needs.check-release.outputs.release_tag != '' && 'production' || 'staging' }}
      DEPLOY_USER: staff-app
      DEPLOY_PATH: ${{ needs.check-release.outputs.release_tag != '' && '/home/staff-app/staff-app-production' || '/home/staff-app/staff-app-staging' }}
      SYSTEMD_USER_PATH: /home/staff-app/.config/systemd/user
      SERVICE_NAME: ${{ needs.check-release.outputs.release_tag != '' && 'staff-app-backend-production' || 'staff-app-backend-staging' }}
      BACKEND_PORT: ${{ needs.check-release.outputs.release_tag != '' && '8420' || '8421' }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      FRONTEND_BASE_URL: ${{ needs.check-release.outputs.release_tag != '' && format('https://staff.{0}', vars.SITE_DOMAIN) || format('https://staff.stage.{0}', vars.SITE_DOMAIN) }}
      DJ_STUDIO_NETWORK: ${{ vars.DJ_STUDIO_NETWORK }}
      STATION_OFFICE_NETWORK: ${{ vars.STATION_OFFICE_NETWORK }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # Empty (the triggering commit) unless this run is deploying a release
        ref: ${{ needs.check-release.outputs.release_tag && format('refs/tags/{0}', needs.check-release.outputs.release_tag) }}

    - name: Validate required secrets and variables
      run: |
        MISSING=()

        # Check secrets
        [ -z "${{ secrets.NETBIRD_SETUP_KEY }}" ] && MISSING+=("NETBIRD_SETUP_KEY (secret)")
        [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && MISSING+=("SSH_PRIVATE_KEY (secret)")
        [ -z "${{ secrets.AIRTABLE_API_KEY }}" ] && MISSING+=("AIRTABLE_API_KEY (secret)")
        [ -z "${{ secrets.AIRTABLE_BASE_ID }}" ] && MISSING+=("AIRTABLE_BASE_ID (secret)")

        # Warn (not fail) if smtp2go key is absent — emails will fall back to the OS's local SMTP relay
        if [ -z "${{ secrets.SMTP2GO_API_KEY }}" ]; then
          echo "WARNING: SMTP2GO_API_KEY not set — email notifications will be sent via the local SMTP relay instead of smtp2go"
        fi

        # Warn (not fail) if spinitron key is absent — DJ names won't be resolved from Spinitron
        if [ -z "${{ secrets.SPINITRON_API_KEY }}" ]; then
          echo "WARNING: SPINITRON_API_KEY not set — DJ names will not be synced from Spinitron"
        fi

        # Check variables
        [ -z "${{ vars.SITE_DOMAIN }}" ] && MISSING+=("SITE_DOMAIN (variable)")
        [ -z "${{ vars.DJ_STUDIO_NETWORK }}" ] && MISSING+=("DJ_STUDIO_NETWORK (variable)")
        [ -z "${{ vars.STATION_OFFICE_NETWORK }}" ] && MISSING+=("STATION_OFFICE_NETWORK (variable)")
        [ -z "${{ vars.NETBIRD_HOSTNAME }}" ] && MISSING+=("NETBIRD_HOSTNAME (variable)")

        if [ ${#MISSING[@]} -gt 0 ]; then
          echo "ERROR: Missing required secrets/variables:"
          printf '  - %s\n' "${MISSING[@]}"
          echo ""
          echo "Please configure these in GitHub Settings > Secrets and variables > Actions"
          exit 1
        fi

        echo "All required secrets and variables are configured"

    - name: Connect to Netbird
      # uses: Alemiz112/netbird-connect@v1.0.1
      uses: gene1wood/netbird-connect@b8c6916d108aee5e327546e49efcd29bbd41b69f # v1.1.0
      with:
        setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
        args: '--log-level DEBUG'

    - name: Fetch Netbird IP of target server
      id: get-target-ip
      run: |
        set -ex
        attempts=1
        while [ $attempts -lt 15 ]; do
          (( attempts++ ))
          STATUS="$(sudo netbird status --filter-by-names ${{ vars.NETBIRD_HOSTNAME }} --filter-by-status connected --json)"
          IP="$(echo "$STATUS" | jq --raw-output '.peers.details[0].netbirdIp')"
          if [ -n "$IP" ] && [ "$IP" != "null" ]; then
            echo "ip=$IP" >> "$GITHUB_OUTPUT"
            break
          else
            sleep 2
          fi
        done
        test -n "$IP" && test "$IP" != "null"

    - name: Configure SSH
      run: |
        set -ex
        SSH_HOST="${{ steps.get-target-ip.outputs.ip }}"
        install --directory --mode=0700 ~/.ssh
        install --no-target-directory --mode=0600 /dev/null ~/.ssh/deploy_key
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        attempts=1
        while ! ssh-keyscan ${SSH_HOST} > ~/.ssh/known_hosts; do
          (( attempts++ ))
          if [ $attempts -gt 5 ]; then
            exit 1
          fi
          sleep 2
        done
        chmod 600 ~/.ssh/known_hosts

    - name: Download frontend build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: frontend-dist
        path: frontend/dist/

    - name: Deploy application
      run: |
        set -ex
        SSH_HOST="${{ steps.get-target-ip.outputs.ip }}"

        # Prepare deployment directories and backup database
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${SSH_HOST} bash << 'ENDSSH'
        set -ex
        # Apache (www-data) needs traversal access into the home directory to
        # serve the frontend static files from frontend/dist via Alias.
        chmod 755 /home/staff-app
        mkdir -p ${{ env.DEPLOY_PATH }}/backend/data
        mkdir -p ${{ env.DEPLOY_PATH }}/frontend/dist
        mkdir -p ${{ env.SYSTEMD_USER_PATH }}
        if [ -f "${{ env.DEPLOY_PATH }}/backend/data/staff-app.db" ]; then
          cp "${{ env.DEPLOY_PATH }}/backend/data/staff-app.db" \
             "${{ env.DEPLOY_PATH }}/backend/data/backup_$(date +%Y%m%d_%H%M%S).db"
        fi
        ENDSSH

        # Sync backend code
        rsync --recursive --links --perms --times --itemize-changes --compress --delete --rsh="ssh -i ~/.ssh/deploy_key" \
          --exclude='venv' \
          --exclude='__pycache__' \
          --exclude='.pytest_cache' \
          --exclude='*.pyc' \
          --exclude='.coverage' \
          --exclude='test*.db' \
          --exclude='data' \
          ./backend/ ${{ env.DEPLOY_USER }}@${SSH_HOST}:${{ env.DEPLOY_PATH }}/backend/

        # Sync frontend build
        rsync --recursive --links --perms --times --itemize-changes --compress --delete --rsh="ssh -i ~/.ssh/deploy_key" \
          ./frontend/dist/ ${{ env.DEPLOY_USER }}@${SSH_HOST}:${{ env.DEPLOY_PATH }}/frontend/dist/

        # Install dependencies, run migrations, restart backend
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${SSH_HOST} bash << 'ENDSSH'
        set -ex

        # Write .env
        touch ${{ env.DEPLOY_PATH }}/backend/.env
        chmod 600 ${{ env.DEPLOY_PATH }}/backend/.env
        cat > ${{ env.DEPLOY_PATH }}/backend/.env << EOF
        DATABASE_URL=sqlite:///${{ env.DEPLOY_PATH }}/backend/data/staff-app.db
        DJ_STUDIO_NETWORK=${{ env.DJ_STUDIO_NETWORK }}
        STATION_OFFICE_NETWORK=${{ env.STATION_OFFICE_NETWORK }}
        SITE_ADMIN_EMAILS=${{ vars.SITE_ADMIN_EMAILS }}
        AIRTABLE_API_KEY=${{ secrets.AIRTABLE_API_KEY }}
        AIRTABLE_BASE_ID=${{ secrets.AIRTABLE_BASE_ID }}
        SPINITRON_API_KEY=${{ secrets.SPINITRON_API_KEY }}
        CORS_ORIGINS=https://${{ env.SITE_DOMAIN }}
        FRONTEND_BASE_URL=${{ env.FRONTEND_BASE_URL }}
        ENVIRONMENT=${{ env.ENV_NAME }}
        APP_VERSION=${{ needs.check-release.outputs.release_tag || github.sha }}
        SMTP2GO_API_KEY=${{ secrets.SMTP2GO_API_KEY }}
        EMAIL_FROM_ADDRESS=${{ vars.EMAIL_FROM_ADDRESS }}
        WEBMASTER_EMAIL=${{ vars.WEBMASTER_EMAIL }}
        WORKFORMS_ENABLED=${{ env.ENV_NAME == 'staging' }}
        DIRECTORY_ENABLED=${{ env.ENV_NAME == 'staging' }}
        LEGACY_IMPORT_ENABLED=${{ vars.LEGACY_IMPORT_ENABLED || 'false' }}
        FEATURE_BIN_SHEET_ID=${{ secrets.FEATURE_BIN_SHEET_ID }}
        FEATURE_BIN_SHEET_GID=${{ secrets.FEATURE_BIN_SHEET_GID }}
        KALX_LIVE_CALENDAR_ID=${{ vars.KALX_LIVE_CALENDAR_ID }}
        EOF

        # Install/update Python dependencies
        cd ${{ env.DEPLOY_PATH }}/backend
        python3 -m venv venv
        venv/bin/pip install --upgrade pip
        venv/bin/pip install -r requirements.txt

        # Run database migrations
        venv/bin/alembic upgrade head
        ENDSSH

        # Deploy systemd service file
        rsync --times --itemize-changes --compress --rsh="ssh -i ~/.ssh/deploy_key" \
          ./systemd/${{ env.SERVICE_NAME }}.service \
          ${{ env.DEPLOY_USER }}@${SSH_HOST}:${{ env.SYSTEMD_USER_PATH }}/${{ env.SERVICE_NAME }}.service

        # Reload systemd, enable (idempotent, needed on first deploy to a new
        # environment), and restart the backend service to pick up new code
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${SSH_HOST} bash << 'ENDSSH'
        set -ex
        systemctl --user daemon-reload
        systemctl --user enable ${{ env.SERVICE_NAME }}
        systemctl --user restart ${{ env.SERVICE_NAME }}
        ENDSSH

    - name: Verify deployment
      run: |
        set -ex
        SSH_HOST="${{ steps.get-target-ip.outputs.ip }}"
        ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${SSH_HOST} bash << 'ENDSSH'
        set -ex

        wait_for_service() {
          local service_name=$1
          local max_attempts=30
          local attempt=0
          echo "Waiting for $service_name to start..."
          while [ $attempt -lt $max_attempts ]; do
            if systemctl --user is-active --quiet $service_name; then
              echo "$service_name is active"
              return 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts..."
            sleep 2
          done
          echo "ERROR: $service_name failed to start within timeout"
          systemctl --user status $service_name || true
          return 1
        }

        wait_for_service ${{ env.SERVICE_NAME }}

        max_attempts=15
        attempt=0
        while [ $attempt -lt $max_attempts ]; do
          if curl -f http://127.0.0.1:${{ env.BACKEND_PORT }}/health 2>/dev/null; then
            echo "Backend health check passed"
            break
          fi
          attempt=$((attempt + 1))
          if [ $attempt -eq $max_attempts ]; then
            echo "ERROR: Backend health check failed"
            exit 1
          fi
          echo "Health check attempt $attempt/$max_attempts..."
          sleep 2
        done
        ENDSSH

    # The nightly check reads this to tell that the release has been deployed
    - name: Record the deployment
      if: env.RELEASE_TAG != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -ex
        DEPLOYMENT_ID="$(jq --null-input --arg ref "$RELEASE_TAG" \
          '{ref: $ref, environment: "production", auto_merge: false, required_contexts: []}' \
          | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
        gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" -f state=success
